services:
  nginx:
    build: ./docker/nginx
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - python
    networks: [appnet]

  python:
    build: ./docker/python
    working_dir: /app
    environment:
      WSGI_APP: ${WSGI_APP:-app:application}
    volumes:
      - ./src:/app
    command: ["sh", "-c", "exec gunicorn --reload --bind 0.0.0.0:8000 \"$$WSGI_APP\""]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    networks: [appnet]

  mysql:
    image: mysql:9.7
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -uroot, -proot]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appnet]

  postgres:
    image: postgres:18
    profiles: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appnet]

  redis:
    image: redis:7
    command: [redis-server, --appendonly, "no"]
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
